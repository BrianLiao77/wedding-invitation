<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我們的幸福聚會 ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #fdf6ee;
      --blush: #e8c4b0;
      --rose:  #c9856a;
      --deep:  #7a3e2e;
      --gold:  #c8a86b;
      --ink:   #3b2a1f;
      --soft:  #f5ebe0;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Decorative background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 10%, rgba(200,168,107,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 90%, rgba(201,133,106,.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(232,196,176,.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative; z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown .9s ease both;
    }

    .header-ornament {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-bottom: 20px;
    }
    .ornament-line {
      flex: 1; max-width: 100px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .ornament-line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .ornament-diamond {
      width: 8px; height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .header-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      letter-spacing: .25em;
      color: var(--rose);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 7vw, 54px);
      font-weight: 700;
      color: var(--deep);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .header-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: var(--rose);
      letter-spacing: .05em;
    }

    /* ── Invitation card ── */
    .invite-card {
      background: white;
      border: 1px solid rgba(200,168,107,.3);
      border-radius: 2px;
      padding: 40px 44px;
      margin-bottom: 36px;
      position: relative;
      box-shadow: 0 4px 40px rgba(122,62,46,.06), 0 1px 4px rgba(122,62,46,.04);
      animation: fadeUp .9s .2s ease both;
    }

    .invite-card::before,
    .invite-card::after {
      content: '✦';
      position: absolute;
      font-size: 10px;
      color: var(--gold);
    }
    .invite-card::before { top: 14px; left: 14px; }
    .invite-card::after  { bottom: 14px; right: 14px; }

    .invite-text {
      font-size: 15.5px;
      line-height: 2;
      color: #5a3f32;
      letter-spacing: .04em;
    }

    /* ── Info pills ── */
    .info-row {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-top: 28px;
    }

    .info-pill {
      display: flex; align-items: center; gap: 10px;
      background: var(--soft);
      border: 1px solid rgba(200,168,107,.35);
      border-radius: 50px;
      padding: 10px 20px;
      flex: 1; min-width: 200px;
    }

    .info-pill-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .info-pill-body { display: flex; flex-direction: column; }
    .info-pill-label {
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--rose);
      font-family: 'Cormorant Garamond', serif;
    }
    .info-pill-value {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--deep);
      letter-spacing: .02em;
    }

    /* ── Form card ── */
    .form-card {
      background: white;
      border: 1px solid rgba(200,168,107,.3);
      border-radius: 2px;
      padding: 40px 44px;
      box-shadow: 0 4px 40px rgba(122,62,46,.06);
      animation: fadeUp .9s .4s ease both;
    }

    .form-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--deep);
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(200,168,107,.3);
      display: flex; align-items: center; gap: 10px;
    }
    .form-section-title span { font-size: 18px; }

    .form-group {
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 8px;
      font-family: 'Cormorant Garamond', serif;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 13px 18px;
      border: 1px solid rgba(200,168,107,.45);
      border-radius: 2px;
      background: var(--soft);
      font-family: 'Noto Serif TC', serif;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
      -webkit-appearance: none;
    }

    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    input:focus, textarea:focus {
      border-color: var(--gold);
      background: white;
      box-shadow: 0 0 0 3px rgba(200,168,107,.15);
    }

    textarea { resize: vertical; min-height: 110px; line-height: 1.8; }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--deep) 0%, var(--rose) 100%);
      color: white;
      border: none;
      border-radius: 2px;
      font-family: 'Noto Serif TC', serif;
      font-size: 15px;
      letter-spacing: .18em;
      cursor: pointer;
      transition: opacity .25s, transform .15s, box-shadow .25s;
      box-shadow: 0 4px 20px rgba(122,62,46,.2);
    }
    .submit-btn:hover  { opacity: .9; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(122,62,46,.28); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Success overlay ── */
    .success-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(253,246,238,.92);
      backdrop-filter: blur(6px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      animation: fadeIn .4s ease;
    }
    .success-overlay.show { display: flex; }

    .success-box {
      text-align: center;
      background: white;
      border: 1px solid rgba(200,168,107,.4);
      padding: 56px 64px;
      border-radius: 4px;
      box-shadow: 0 20px 80px rgba(122,62,46,.12);
      max-width: 400px; width: 90%;
      animation: scaleIn .45s cubic-bezier(.16,1,.3,1) both;
    }
    .success-icon { font-size: 52px; margin-bottom: 16px; }
    .success-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px; color: var(--deep);
      margin-bottom: 12px;
    }
    .success-msg {
      font-size: 14.5px; line-height: 1.9;
      color: #7a5e50;
    }

    /* ── Error message ── */
    .error-msg {
      display: none;
      margin-top: 10px;
      padding: 12px 16px;
      background: #fff0ee;
      border: 1px solid #e8b0a0;
      border-radius: 2px;
      font-size: 13px;
      color: var(--deep);
      line-height: 1.6;
    }
    .error-msg.show { display: block; }

    /* ── Footer note ── */
    .footer-note {
      text-align: center;
      margin-top: 36px;
      font-size: 12px;
      color: #b89a88;
      letter-spacing: .05em;
      animation: fadeUp .9s .6s ease both;
    }

    /* ── Floating petals ── */
    .petal {
      position: fixed;
      pointer-events: none;
      font-size: 16px;
      opacity: 0;
      animation: fall linear infinite;
      z-index: 0;
    }

    /* ── Animations ── */
    @keyframes fadeDown  { from { opacity:0; transform: translateY(-24px); } to { opacity:1; transform: none; } }
    @keyframes fadeUp    { from { opacity:0; transform: translateY(24px);  } to { opacity:1; transform: none; } }
    @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn   { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
    @keyframes fall {
      0%   { opacity:.7; transform: translateY(-20px) rotate(0deg); }
      100% { opacity:0;  transform: translateY(100vh) rotate(360deg); }
    }

    @media (max-width: 480px) {
      .invite-card, .form-card { padding: 28px 24px; }
      .info-row { flex-direction: column; }
      .info-pill { min-width: unset; }
    }
  </style>
</head>
<body>

<!-- Floating petals -->
<div id="petals"></div>

<div class="page-wrapper">

  <!-- Header -->
  <header class="header">
    <div class="header-label">Wedding Celebration</div>
    <div class="header-ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>
    <h1 class="header-title">我們要結婚啦 🎊</h1>
    <div class="header-subtitle">誠摯邀請您出席我們的幸福聚會</div>
  </header>

  <!-- Invitation card -->
  <div class="invite-card">
    <p class="invite-text">
      我跟女友準備走進人生下一個階段了，
