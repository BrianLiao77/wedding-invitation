<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廖經治 & 周昀儀 婚宴邀請</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5e6e8 0%, #fdf0f0 50%, #f0e6f5 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 花瓣動畫 */
        .petal {
            position: fixed;
            top: -20px;
            width: 12px;
            height: 12px;
            background: radial-gradient(ellipse, #ffb7c5, #ff8fa3);
            border-radius: 50% 0 50% 0;
            opacity: 0.7;
            animation: falling linear infinite;
            z-index: 0;
        }

        @keyframes falling {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 彩帶動畫 */
        .confetti {
            position: fixed;
            top: -10px;
            width: 8px;
            height: 16px;
            opacity: 0.6;
            animation: confettiFall linear infinite;
            z-index: 0;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* 頂部裝飾 */
        .top-decoration {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            letter-spacing: 10px;
        }

        /* 主卡片 */
        .card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(255, 150, 170, 0.2);
            border: 1px solid rgba(255, 183, 197, 0.3);
            text-align: center;
        }

        .subtitle {
            color: #c9748a;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .names {
            font-size: 48px;
            color: #8b4560;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .names span {
            color: #c9748a;
            font-size: 32px;
            margin: 0 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            gap: 15px;
        }

        .divider-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(to right, transparent, #c9748a);
        }

        .divider-line.right {
            background: linear-gradient(to left, transparent, #c9748a);
        }

        .divider-icon {
            font-size: 20px;
        }

        .invitation-text {
            color: #7a5060;
            font-size: 16px;
            line-height: 2;
            margin-bottom: 30px;
        }

        /* 資訊區塊 */
        .info-section {
            background: linear-gradient(135deg, #fff5f7, #fdf0f5);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 183, 197, 0.4);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            color: #6b4455;
        }

        .info-icon {
            font-size: 22px;
            width: 35px;
            text-align: center;
        }

        .info-content {
            text-align: left;
        }

        .info-label {
            font-size: 11px;
            color: #c9748a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 16px;
            color: #5a3545;
            font-weight: 600;
        }

        /* 注意事項 */
        .notice-section {
            background: linear-gradient(135deg, #fff9f0, #fff5e6);
            border-radius: 15px;
            padding: 25px 30px;
            margin: 25px 0;
            border: 1px solid rgba(255, 200, 150, 0.4);
            text-align: left;
        }

        .notice-title {
            color: #c9748a;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 15px;
        }

        .notice-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 10px 0;
            color: #7a5060;
            font-size: 14px;
            line-height: 1.8;
        }

        .notice-dot {
            color: #c9748a;
            font-size: 18px;
            line-height: 1.5;
        }

        /* 表單區塊 */
        .form-section {
            margin-top: 35px;
            text-align: left;
        }

        .form-title {
            text-align: center;
            color: #8b4560;
            font-size: 18px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #c9748a;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(201, 116, 138, 0.3);
            border-radius: 10px;
            font-size: 15px;
            color: #5a3545;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c9748a;
            box-shadow: 0 0 0 3px rgba(201, 116, 138, 0.1);
            background: white;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #c9748a, #e8a0b0);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 116, 138, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 成功訊息 */
        .success-message {
            display: none;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f0fff4, #e6ffed);
            border-radius: 15px;
            border: 1px solid rgba(100, 200, 130, 0.3);
            margin-top: 20px;
        }

        .success-message .success-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #4a8060;
            font-size: 16px;
            line-height: 1.8;
        }

        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #c9748a;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }
            .names {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- 花瓣與彩帶 -->
    <div id="petals"></div>

    <div class="container">
        <div class="top-decoration">🌸 🤍 🌸</div>

        <div class="card">
            <p class="subtitle">Wedding Invitation</p>

            <div class="names">
                廖經治 <span>&</span> 周昀儀
            </div>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-icon">💍</div>
                <div class="divider-line right"></div>
            </div>

            <p class="invitation-text">
                親愛的朋友，<br>
                我們即將步入人生新的階段<br>
                誠摯邀請您來陪我們一起慶祝<br>
                也會在現場發放喜餅給各位 🎁
            </p>

            <!-- 活動資訊 -->
            <div class="info-section">
                <div class="info-item">
                    <div class="info-icon">📅</div>
                    <div class="info-content">
                        <div class="info-label">Date</div>
                        <div class="info-value">2025年7月19日（週六）</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">🕐</div>
                    <div class="info-content">
                        <div class="info-label">Time</div>
                        <div class="info-value">中午 12:00</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">📍</div>
                    <div class="info-content">
                        <div class="info-label">Location</div>
                        <div class="info-value">岩漿火鍋（台中公益店）</div>
                    </div>
                </div>
            </div>

            <!-- 注意事項 -->
            <div class="notice-section">
                <p class="notice-title">✨ 溫馨提醒 ✨</p>
                <div class="notice-item">
                    <span class="notice-dot">🌸</span>
                    <span>本次婚宴<strong>不收禮金</strong>，您的祝福就是最好的禮物</span>
                </div>
                <div class="notice-item">
                    <span class="notice-dot">🌸</span>
                    <span>餐費採<strong>各自付費</strong>方式，輕鬆愉快共享美食</span>
                </div>
                <div class="notice-item">
                    <span class="notice-dot">🌸</span>
                    <span>歡迎隨時回覆，<strong>無報名截止日</strong></span>
                </div>
            </div>

            <!-- 回覆表單 -->
            <div class="form-section">
                <p class="form-title">💌 出席回覆</p>

                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" id="name" placeholder="請輸入您的姓名" />
                </div>

                <div class="form-group">
                    <label>出席人數</label>
                    <select id="guests">
                        <option value="">請選擇</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人以上</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>祝福話語（選填）</label>
                    <textarea id="message" placeholder="留下您對新人的祝福..."></textarea>
                </div>

                <button class="submit-btn" onclick="submitForm()">✉ 送出回覆</button>
            </div>

            <!-- 成功訊息 -->
            <div class="success-message" id="successMessage">
                <div class="success-icon">🎊</div>
                <p>
                    感謝您的回覆！<br>
                    我們期待在婚宴上見到您 🌸<br>
                    <strong>2025年7月19日，不見不散！</strong>
                </p>
            </div>

            <div class="footer">
                <p>— 廖經治 & 周昀儀 敬上 —</p>
            </div>
        </div>
    </div>

    <script>
        // 產生花瓣與彩帶
        function createPetals() {
            const container = document.getElementById('petals');
            const colors = ['#ffb7c5', '#ff8fa3', '#ffc2d4', '#ffccd5', '#ff85a1'];
            const confettiColors = ['#ffd700', '#ff69b4', '#87ceeb', '#98fb98', '#dda0dd'];

            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 4 + 4) + 's';
                petal.style.animationDelay = (Math.random() * 6) + 's';
                petal.style.background = `radial-gradient(ellipse, ${colors[Math.floor(Math.random() * colors.length)]}, #ff8fa3)`;
                petal.style.transform = `scale(${Math.random() * 0.8 + 0.5})`;
                container.appendChild(petal);
            }

            for (let i = 0; i < 10; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 4 + 5) + 's';
                confetti.style.animationDelay = (Math.random() * 8) + 's';
                confetti.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                container.appendChild(confetti);
            }
        }

        createPetals();

        // 表單送出
        function submitForm() {
            const name = document.getElementById('name').value.trim();
            const guests = document.getElementById('guests').value;
            const message = document.getElementById('message').value.trim();

            if (!name) {
                alert('請輸入您的姓名 😊');
                return;
            }
            if (!guests) {
                alert('請選擇出席人數 😊');
                return;
            }

            const btn = document.querySelector('.submit-btn');
            btn.textContent = '送出中...';
            btn.disabled = true;

            fetch('https://script.google.com/macros/s/AKfycbzkxhPzOeL-Lu0TjKAcE0hJXeznaNUvK84JK50lnUk3wD22DSPidzHk4m062q0fo0lGwA/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, guests, message }),
                mode: 'no-cors'
            })
            .then(() => {
                document.querySelector('.form-section').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            })
            .catch(() => {
                document.querySelector('.form-section').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            });
        }
    </script>

</body>
</html>
